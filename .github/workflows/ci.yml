name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile api.py service.py phishing_detector.py feature_extractor.py train_model.py prepare_dataset.py evaluate_model.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate browser extension scripts
        run: |
          node --check extenison/background.js
          node --check extenison/popup.js
          node --check extenison/blocked.js
          node --test extenison/extension.test.mjs
