<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIGIL URL protection</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" aria-labelledby="title">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">V</span><span id="title">VIGIL</span></div>
      <div class="protection" id="protection" role="status"><span class="status-dot" aria-hidden="true"></span><span>Checking</span></div>
    </header>

    <section class="site" aria-labelledby="site-heading">
      <p class="eyebrow" id="site-heading">Current site</p>
      <div class="site-url" id="site-url">Reading current tab…</div>
    </section>

    <section class="state-panel initializing" id="state-panel" aria-live="polite">
      <div class="state-heading"><span class="state-icon" id="state-icon" aria-hidden="true">•</span><div><h1 id="state-title">Initializing</h1><p id="state-summary">Preparing URL protection.</p></div></div>
      <div class="metrics" id="metrics" hidden>
        <div><span>Risk score</span><strong id="risk">—</strong><small>/100</small></div>
        <div><span>Effective probability</span><strong id="probability">—</strong></div>
      </div>
    </section>

    <section class="evidence" id="evidence-section" hidden aria-labelledby="evidence-heading">
      <div class="section-head"><p class="eyebrow" id="evidence-heading">Why this result</p><span id="signal-count"></span></div>
      <ul id="evidence-list"></ul>
    </section>

    <section class="details" id="details" hidden>
      <div><span>HTTPS</span><strong id="https-value">—</strong></div>
      <div><span>IP address</span><strong id="ip-value">—</strong></div>
      <div><span>Subdomains</span><strong id="subdomain-value">—</strong></div>
      <div><span>Model</span><strong id="model-value">—</strong></div>
    </section>

    <p class="notice" id="notice" hidden></p>
    <footer class="actions">
      <button class="secondary" id="copy-btn" type="button" disabled>Copy URL</button>
      <button class="primary" id="scan-btn" type="button">Scan current page</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
